name: Checks (windows)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/cli/**"
      - "packages/core/src/init/**"
      - "packages/core/src/datasource/**"
      - "packages/core/src/config/**"
      - "packages/catalog/src/node/**"
      - "scripts/test-cli-integration.mjs"
      - ".github/workflows/checks-windows.yml"

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: |
          npm run build

      - name: Lint
        working-directory: examples/example-1
        run: npx featurevisor lint

      - name: Example 1 tests
        working-directory: examples/example-1
        run: npx featurevisor test

      - name: Package and example tests
        run: npx lerna run test

      - name: CLI integration
        run: node scripts/test-cli-integration.mjs

      - name: JavaScript runner conformance
        run: node scripts/test-runner-conformance.mjs javascript
