name: Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - review_requested

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: make install

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Check editor schemas and release configuration
        run: |
          node scripts/test-editor-schemas.mjs
          node scripts/test-release-config.mjs

      - name: Test
        # Includes packed consumers and the isolated React 16.8.0 smoke through npm test.
        run: make test

      - name: CLI integration
        run: node scripts/test-cli-integration.mjs

      - name: JavaScript runner conformance
        run: node scripts/test-runner-conformance.mjs javascript

      - name: JavaScript mutation conformance
        run: node scripts/test-mutation-conformance.mjs javascript

      - name: Bundle size budgets
        run: make bundle-sizes

      - name: Catalog browser
        # Ubuntu runners include Google Chrome.
        run: npm run test:catalog-browser
