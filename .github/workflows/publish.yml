name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Publish
    runs-on: ubuntu-latest
    # Publishing pauses between packages and after a failure, so it needs more than the checks
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: make install

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Test
        # Slower checks run locally through `make check` before releasing.
        run: make test

      - name: Bump version
        # Conventional commits choose each bump: fix is a patch, feat a minor, and a ! header
        # or a BREAKING CHANGE footer a major. Packages without changes keep their versions.
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          npx lerna version --conventional-commits --conventional-graduate --exact --yes --no-push

      - name: Publish
        # One package at a time in dependency order, a pause apart, trying again a few minutes
        # after a failure (scripts/publish-packages.mjs). It publishes only versions missing
        # from npm, so a job that still fails can be resumed by running it again.
        run: |
          unset NODE_AUTH_TOKEN
          rm -f .npmrc
          npm config delete always-auth 2>/dev/null || true
          node scripts/publish-packages.mjs

      - name: Push back to GitHub
        run: |
          git push --follow-tags
