name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: make install

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Check editor schemas and release configuration
        run: |
          node scripts/test-editor-schemas.mjs
          node scripts/test-release-config.mjs

      - name: Test
        # Includes the packed package consumer test through npm test.
        run: make test

      - name: CLI integration
        run: node scripts/test-cli-integration.mjs

      - name: JavaScript runner conformance
        run: node scripts/test-runner-conformance.mjs javascript

      - name: JavaScript mutation conformance
        run: node scripts/test-mutation-conformance.mjs javascript

      - name: Bump version
        # Force the initial v4 release, then recognise both ! headers and breaking footers.
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor}}@users.noreply.github.com"
          node scripts/release-version.mjs

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          rm -f .npmrc
          npm config delete always-auth 2>/dev/null || true
          npx lerna publish --no-private from-git --yes

      - name: Push back to GitHub
        run: |
          git push --follow-tags
