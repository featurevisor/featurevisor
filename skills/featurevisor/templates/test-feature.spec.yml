feature: <featureKey>

assertions:
  # Write each description as the promise in plain words, so a reviewer
  # who does not read YAML can follow it.
  - key: rollout-gated
    description: Everyone is out while the rollout is at 0%
    # Add environment: production only when that environment is configured.
    at: 99
    context:
      userId: "test-user-1"
    expectedToBeEnabled: false

  # If the feature has variations, assert each by picking `at` in its weight band.
