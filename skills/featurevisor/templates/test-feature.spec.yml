feature: <featureKey>
assertions:
  - key: rollout-gated
    description: Everyone is gated at 0% rollout
    # Add environment: production only when that environment is configured.
    at: 99
    context:
      userId: "test-user-1"
    expectedToBeEnabled: false

  # If the feature has variations, assert each by picking `at` in their weight band.
