# A scenario checks several definitions together. It has root `checks`
# instead of a feature, segment or variable owner.
description: Maintenance mode switches off checkout and everything built on it

# Pretend the kill switch is on, without editing variables/maintenanceMode.yml.
stickyVariables:
  maintenanceMode: true

at: 5

context:
  userId: test-user-nl
  country: nl

checks:
  - key: checkout-off
    description: The root gate disables checkout
    feature: checkout
    enabled: false

  - key: no-promo
    description: The promo banner falls back to its disabledValue
    variable: checkoutPromoBanner
    operator: equals
    value: ""

  - key: view-reports-off
    description: The composed view reports checkout as disabled
    variable: checkoutView
    path: enabled
    operator: equals
    value: false

children:
  - description: QA keeps access, because force entries run before the root gate
    context:
      userId: u_qa_1
    stickyVariables:
      maintenanceMode: true
    checks:
      - feature: checkout
        enabled: true
        variation: treatment
