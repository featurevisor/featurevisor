feature: checkout

assertions:
  - key: nl-local-payments
    description: The Netherlands gets local payment methods at any bucket
    at: 95
    context:
      userId: test-user-nl
      country: nl
    expectedToBeEnabled: true
    expectedVariables:
      paymentMethods:
        - paypal
        - ideal
      allowDiscountCode: true

  - key: nl-free-plan
    description: The free plan gets no discount code, even in the Netherlands
    at: 95
    context:
      userId: test-user-nl
      country: nl
      plan: free
    expectedToBeEnabled: true
    expectedVariables:
      allowDiscountCode: false

  - key: everyone-inside-rollout
    description: Outside the Netherlands, buckets below 10 are in
    at: 5
    context:
      userId: test-user-us
      country: us
    expectedToBeEnabled: true

  - key: everyone-outside-rollout
    description: Outside the Netherlands, buckets above 10 are out
    at: 50
    context:
      userId: test-user-us-2
      country: us
    expectedToBeEnabled: false

  - key: treatment-hero
    description: Treatment changes only the hero subtitle
    at: 75
    context:
      userId: test-user-nl-2
      country: nl
    expectedToBeEnabled: true
    expectedVariation: treatment
    expectedVariables:
      hero:
        title: Checkout
        subtitle: Faster, simpler checkout

  - key: qa-force
    description: QA is forced into the treatment while the rollout is low
    at: 50
    context:
      userId: u_qa_1
      country: us
    expectedToBeEnabled: true
    expectedVariation: treatment

  - key: maintenance
    description: The maintenanceMode kill switch disables checkout
    at: 95
    context:
      userId: test-user-nl
      country: nl
    stickyVariables:
      maintenanceMode: true
    expectedToBeEnabled: false
    children:
      - description: QA keeps access, because force entries run before the root gate
        context:
          userId: u_qa_1
        stickyVariables:
          maintenanceMode: true
        expectedToBeEnabled: true

  - key: nl-matrix
    description: The Netherlands is in at bucket ${{ at }}
    matrix:
      at:
        - 10
        - 90
    at: ${{ at }}
    context:
      userId: matrix-user-${{ at }}
      country: nl
    expectedToBeEnabled: true
