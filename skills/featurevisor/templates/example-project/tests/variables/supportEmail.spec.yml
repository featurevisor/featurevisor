variable: supportEmail

assertions:
  - description: Production — NL shoppers get the local address
    environment: production
    context:
      country: nl
    expectedValue: support-nl@example.com
    expectedEvaluation:
      reason: variable_override_rule
      variableOverrideKey: netherlands

  - description: Production — everyone else gets the default
    environment: production
    context:
      country: us
    expectedValue: support@example.com

  - description: Staging has no overrides, so the default applies in NL too
    environment: staging
    context:
      country: nl
    expectedValue: support@example.com
