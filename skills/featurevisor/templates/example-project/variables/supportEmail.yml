description: Support address shown across the storefront

type: string

defaultValue: support@example.com

# Global variables are never bucketed, so overrides have no percentage.
# The first matching override wins for everyone it matches.
# With environments configured, nest this list under each environment key.
overrides:
  - key: netherlands
    description: Dutch shoppers reach the local support desk
    conditions: countries.netherlands
    value: support-nl@example.com
