description: <Feature with A/B test>

bucketBy: userId

# Variation weights must sum to 100, with up to three decimals each.
# Lint reports any other sum.
# "control" and "treatment" are conventions. Any unique strings work.
variations:
  - value: control
    description: Existing experience
    weight: 50

  - value: treatment
    description: New experience under test
    weight: 50

# Optional: return a specific variation (instead of null) when the flag is off.
# disabledVariationValue: control

# With environments configured, nest this list under each environment key.
rules:
  - key: everyone
    conditions: "*"
    percentage: 0 # ramp up, and never rename the key
