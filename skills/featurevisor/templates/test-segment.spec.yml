segment: <segmentKey>
assertions:
  - key: matches-inside
    description: Matches inside the segment
    context:
      country: nl
    expectedToMatch: true

  - key: does-not-match-outside
    description: Does not match outside the segment
    context:
      country: de
    expectedToMatch: false

