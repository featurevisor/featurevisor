description: Browser-specific optimizations

tags:
  - all
  - web

bucketBy: userId

force:
  production:
    - conditions: chromeUsers
      enabled: true

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: chrome-users
      conditions: chromeUsers
      percentage: 100

    - key: other-browsers
      conditions: "*"
      percentage: 50
