description: Premium features for premium subscribers

tags:
  - all
  - web
  - ios
  - android

bucketBy: userId

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: premium-users
      conditions: premiumUsers
      percentage: 100

    - key: regular-users
      conditions: "*"
      percentage: 0
