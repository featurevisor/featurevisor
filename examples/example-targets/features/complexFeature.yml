description: Complex feature with variations and variable overrides
tags:
  - all
  - web
  - ios

bucketBy: userId

variablesSchema:
  theme:
    type: string
    defaultValue: light
  fontSize:
    type: integer
    defaultValue: 14

variations:
  - value: control
    weight: 50
    variables:
      theme: light
      fontSize: 14
    variableOverrides:
      theme:
        - value: dark
          conditions: premiumUsers
        - value: auto
          conditions: chromeUsers
      fontSize:
        - value: 16
          conditions: premiumUsers

  - value: treatment
    weight: 50
    variables:
      theme: dark
      fontSize: 16
    variableOverrides:
      theme:
        - value: light
          conditions: premiumUsers
      fontSize:
        - value: 18
          conditions: premiumChromeUsers

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: premium-chrome
      conditions: premiumChromeUsers
      percentage: 100

    - key: premium-only
      conditions: premiumUsers
      percentage: 80

    - key: chrome-only
      conditions: chromeUsers
      percentage: 60

    - key: everyone-else
      conditions: "*"
      percentage: 30

force:
  production:
    - conditions: adminUsers
      enabled: true
      variation: treatment
      variables:
        theme: dark
        fontSize: 18
