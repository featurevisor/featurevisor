description: Complex feature with variations and variable overrides

tags:
  - all
  - web
  - ios

bucketBy: userId

variablesSchema:
  theme:
    type: string
    defaultValue: light
  fontSize:
    type: integer
    defaultValue: 14

variations:
  - value: control
    weight: 50
    variables:
      theme: light
      fontSize: 14
    variableOverrides:
      theme:
        - conditions: premiumUsers
          value: dark
        - conditions: chromeUsers
          value: auto
      fontSize:
        - conditions: premiumUsers
          value: 16

  - value: treatment
    weight: 50
    variables:
      theme: dark
      fontSize: 16
    variableOverrides:
      theme:
        - conditions: premiumUsers
          value: light
      fontSize:
        - conditions: premiumChromeUsers
          value: 18

force:
  production:
    - conditions: adminUsers
      enabled: true
      variation: treatment
      variables:
        theme: dark
        fontSize: 18

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: premium-chrome
      conditions: premiumChromeUsers
      percentage: 100

    - key: premium-only
      conditions: premiumUsers
      percentage: 80

    - key: chrome-only
      conditions: chromeUsers
      percentage: 60

    - key: everyone-else
      conditions: "*"
      percentage: 30
