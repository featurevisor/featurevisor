description: Ultra complex feature with deeply nested segments, multiple rules, force entries, and variable overrides
tags:
  - all
  - web
  - ios
  - android

bucketBy: userId

variablesSchema:
  theme:
    type: string
    defaultValue: light
  fontSize:
    type: integer
    defaultValue: 14
  layout:
    type: string
    defaultValue: standard
  animation:
    type: string
    defaultValue: none

variations:
  - value: control
    weight: 40
    variables:
      theme: light
      fontSize: 14
      layout: standard
      animation: none
    variableOverrides:
      theme:
        - value: dark
          conditions: premiumUsers
        - value: auto
          conditions: chromeUsers
        - value: dark
          conditions:
            and: [premiumUsers, chromeUsers]
      fontSize:
        - value: 16
          conditions: premiumUsers
        - value: 18
          conditions: premiumChromeUsers
      layout:
        - value: compact
          conditions:
            or: [premiumUsers, adminUsers]
        - value: expanded
          conditions: chromeUsers
      animation:
        - value: fade
          conditions:
            and: [premiumUsers, chromeUsers]

  - value: treatment
    weight: 40
    variables:
      theme: dark
      fontSize: 16
      layout: expanded
      animation: slide
    variableOverrides:
      theme:
        - value: light
          conditions: premiumUsers
        - value: dark
          conditions:
            or: [chromeUsers, firefoxUsers]
      fontSize:
        - value: 18
          conditions: premiumChromeUsers
        - value: 20
          conditions:
            and: [premiumUsers, adminUsers]
      layout:
        - value: minimal
          conditions: chromeUsers
        - value: full
          conditions:
            or: [premiumUsers, adminUsers]

  - value: experimental
    weight: 20
    variables:
      theme: auto
      fontSize: 14
      layout: minimal
      animation: none
    variableOverrides:
      theme:
        - value: dark
          conditions: premiumChromeUsers
      fontSize:
        - value: 16
          conditions:
            and: [premiumUsers, chromeUsers]

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    # Premium Chrome users - highest priority
    - key: premium-chrome-complex
      conditions:
        and: [premiumUsers, chromeUsers]
      percentage: 100

    # Premium OR Admin users
    - key: premium-or-admin
      conditions:
        or: [premiumUsers, adminUsers]
      percentage: 90

    # Premium users on web or mobile
    - key: premium-web-mobile
      conditions: premiumWebOrMobile
      percentage: 85

    # Chrome OR Firefox browsers
    - key: chrome-or-firefox
      conditions:
        or: [chromeUsers, chromeOrFirefox]
      percentage: 75

    # Non-premium Chrome users
    - key: non-premium-chrome
      conditions: nonPremiumChrome
      percentage: 65

    # Chrome users (simple)
    - key: chrome-simple
      conditions: chromeUsers
      percentage: 55

    # Premium users (simple)
    - key: premium-simple
      conditions: premiumUsers
      percentage: 45

    # Not admin users
    - key: not-admin
      conditions: notAdmin
      percentage: 35

    # Complex nested segment
    - key: complex-nested
      conditions: complexNested
      percentage: 25

    # Everyone else
    - key: everyone-else
      conditions: "*"
      percentage: 15

force:
  production:
    # Premium Chrome users with admin role get experimental (most specific, must come first)
    - conditions:
        and: [premiumChromeUsers, adminUsers]
      enabled: true
      variation: experimental
      variables:
        theme: dark
        fontSize: 18
        layout: full

    # Premium OR Admin on Chrome (must come before general admin)
    - conditions:
        and:
          - or: [premiumUsers, adminUsers]
          - chromeUsers
      enabled: true
      variation: treatment
      variables:
        theme: dark
        fontSize: 18

    # Admin users always get treatment (general case, comes last)
    - conditions: adminUsers
      enabled: true
      variation: treatment
      variables:
        theme: dark
        fontSize: 20
        layout: full
        animation: slide
