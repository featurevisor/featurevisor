description: Checkout redesign with two variations

tags:
  - all
  - checkout

bucketBy: user.id

disabledVariationValue: control

variations:
  - value: control
    weight: 50

  - value: redesigned
    weight: 50

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: netherlands
      conditions: audience/netherlands
      percentage: 100
      variation: redesigned

    - key: everyone
      conditions: "*"
      percentage: 50
