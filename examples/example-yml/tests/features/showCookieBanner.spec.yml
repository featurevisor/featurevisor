feature: showCookieBanner
assertions:
  - at: 10
    description: "Enabled for users in the Netherlands at bucket position 10"
    context:
      country: nl
    expectedToBeEnabled: true

  - at: 70
    description: "Enabled for users in the Netherlands at bucket position 70"
    context:
      country: nl
    expectedToBeEnabled: true

  - at: 90
    description: "Disabled for users in the United States"
    context:
      country: us
    expectedToBeEnabled: false

  - at: 90
    description: "Disabled for users in Canada"
    context:
      country: ca
    expectedToBeEnabled: false
