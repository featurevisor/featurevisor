feature: chatFileUpload

assertions:
  - description: Requires liveChat for v3 releases too
    environment: production
    target: ios
    at: 10
    context:
      userId: user-4
      country: nl
      plan: paid
    stickyFeatures:
      liveChat:
        enabled: false
    expectedToBeEnabled: false

  - description: Dutch paying accounts get it once liveChat is on
    matrix:
      target:
        - ios-v4
        - ios
    environment: production
    target: ${{ target }}
    at: 10
    context:
      userId: user-4
      country: nl
      plan: paid
    stickyFeatures:
      liveChat:
        enabled: true
    expectedToBeEnabled: true

  - description: Recent German apps join the 50% rule
    matrix:
      target:
        - ios-v4
        - ios
    environment: production
    target: ${{ target }}
    at: 40
    context:
      userId: user-5
      country: de
      appVersion: 5.1.0
    stickyFeatures:
      liveChat:
        enabled: true
    expectedToBeEnabled: true

  - description: Older German apps fall through to the 0% rule
    matrix:
      target:
        - ios-v4
        - ios
    environment: production
    target: ${{ target }}
    at: 40
    context:
      userId: user-5
      country: de
      appVersion: 4.9.0
    stickyFeatures:
      liveChat:
        enabled: true
    expectedToBeEnabled: false
