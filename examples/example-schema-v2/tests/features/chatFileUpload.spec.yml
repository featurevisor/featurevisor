feature: chatFileUpload

assertions:
  - description: Requires liveChat on the legacy target too
    target: ios-legacy
    environment: production
    at: 10
    stickyFeatures:
      liveChat:
        enabled: false
    context:
      userId: user-4
      country: nl
      plan: paid
    expectedToBeEnabled: false

  - description: Dutch paying accounts get it once liveChat is on
    matrix:
      target:
        - ios
        - ios-legacy
    target: ${{ target }}
    environment: production
    at: 10
    stickyFeatures:
      liveChat:
        enabled: true
    context:
      userId: user-4
      country: nl
      plan: paid
    expectedToBeEnabled: true

  - description: Recent German apps join the 50% rule
    matrix:
      target:
        - ios
        - ios-legacy
    target: ${{ target }}
    environment: production
    at: 40
    stickyFeatures:
      liveChat:
        enabled: true
    context:
      userId: user-5
      country: de
      appVersion: 5.1.0
    expectedToBeEnabled: true

  - description: Older German apps fall through to the 0% rule
    matrix:
      target:
        - ios
        - ios-legacy
    target: ${{ target }}
    environment: production
    at: 40
    stickyFeatures:
      liveChat:
        enabled: true
    context:
      userId: user-5
      country: de
      appVersion: 4.9.0
    expectedToBeEnabled: false
