description: Demonstrates empty and notEmpty required variable expressions

tags:
  - all

type: string

defaultValue: No emptiness requirement matched

overrides:
  staging:
    - key: empty-source
      conditions: |-
        variable('emptinessSource').label empty
        and variable('emptinessSource').items empty
        and variable('emptinessSource').metadata empty
      value: Source values are empty

    - key: populated-source
      conditions: |-
        variable('emptinessSource').label notEmpty
        and variable('emptinessSource').items notEmpty
        and variable('emptinessSource').metadata notEmpty
      value: Source values are populated

  production:
    - key: empty-source
      conditions: |-
        variable('emptinessSource').label empty
        and variable('emptinessSource').items empty
        and variable('emptinessSource').metadata empty
      value: Source values are empty

    - key: populated-source
      conditions: |-
        variable('emptinessSource').label notEmpty
        and variable('emptinessSource').items notEmpty
        and variable('emptinessSource').metadata notEmpty
      value: Source values are populated
