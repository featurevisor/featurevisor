description: Shared campaign banner using a reusable schema
tags:
  - all
schema: promoBanner
defaultValue:
  message: Welcome
  cta:
    title: Learn more
    url: https://featurevisor.com
overrides:
  staging:
    - key: staging
      conditions: "*"
      mutate:
        message: Welcome to staging
  production:
    - key: netherlands
      conditions: country == 'nl'
      mutate:
        message: Welkom
      overrides:
        - key: amsterdam
          conditions: city == 'amsterdam'
          mutate:
            cta.title: Meer informatie
          overrides:
            - key: mobile
              conditions: mobile
              mutate:
                cta.url: https://featurevisor.com/mobile
    - key: default
      conditions: "*"
      value:
        message: Welcome
        cta:
          title: Learn more
          url: https://featurevisor.com
