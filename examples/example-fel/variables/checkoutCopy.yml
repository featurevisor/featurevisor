description: Checkout heading, with nested overrides reading features and segments

tags: [all, checkout, fel]

type: string

defaultValue: Checkout

disabledValue: Checkout unavailable

conditions: loggedIn == true

overrides:
  staging: &overrides
    - key: express
      conditions: feature('smartCheckout').variation == 'express'
      value: Express checkout
      overrides:
        - key: ideal
          conditions: feature('smartCheckout').paymentMethods includes 'ideal'
          value: Express checkout with iDEAL

        - key: large-order
          conditions: audiences.highValueCart
          value: Express checkout for large orders

    - key: enterprise
      conditions: organization.tier == 'enterprise' or plan == 'enterprise'
      value: Enterprise checkout

    - key: french
      conditions: markets.francophone
      value: Paiement

  production: *overrides
