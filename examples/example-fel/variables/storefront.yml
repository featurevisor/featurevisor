description: Storefront merchandising, with banner keys that need bracket paths in FEL

tags:
  - all
  - fel

type: object

properties:
  banners:
    type: object
    properties:
      black-friday:
        type: object
        properties:
          active:
            type: boolean
          discount:
            type: integer
      spring-sale:
        type: object
        properties:
          active:
            type: boolean
          discount:
            type: integer
  featuredSkus:
    type: array
    items:
      type: string

defaultValue:
  banners:
    black-friday:
      active: true
      discount: 30
    spring-sale:
      active: false
      discount: 10
  featuredSkus:
    - sku-1
    - sku-2
    - sku-3

overrides:
  staging:
    - key: benelux-assortment
      conditions: markets.benelux
      value:
        banners:
          black-friday:
            active: true
            discount: 30
          spring-sale:
            active: false
            discount: 10
        featuredSkus:
          - sku-7
          - sku-1

  production:
    - key: benelux-assortment
      conditions: markets.benelux
      value:
        banners:
          black-friday:
            active: true
            discount: 30
          spring-sale:
            active: false
            discount: 10
        featuredSkus:
          - sku-7
          - sku-1
