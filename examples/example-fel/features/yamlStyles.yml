description: The same kind of expression written in each YAML style

tags:
  - all
  - fel

bucketBy: userId

variablesSchema:
  style:
    type: string
    defaultValue: none

rules:
  staging:
    - key: plain
      conditions: country == 'nl' and device == 'mobile' # featurevisor-ignore-line
      percentage: 100
      variables:
        style: plain

    - key: double-quoted
      conditions: "country == 'de' and device == 'mobile'" # featurevisor-ignore-line
      percentage: 100
      variables:
        style: double-quoted

    - key: literal-block
      conditions: |
        # A literal block keeps line breaks, so comment lines work
        country == 'at'
        and device == 'mobile'
      percentage: 100
      variables:
        style: literal-block

    - key: folded-block
      conditions: >- # featurevisor-ignore-line
        country == 'ch'
        and device == 'mobile'
      percentage: 100
      variables:
        style: folded-block

    - key: list
      conditions:
        - country == 'lu'
        - device == 'mobile'
      percentage: 100
      variables:
        style: list

    - key: tree-group
      conditions:
        or:
          - |
            country == 'dk'
            and device == 'mobile'
          - |
            country == 'se'
            and device == 'tablet'
      percentage: 100
      variables:
        style: tree-group

    - key: mixed
      conditions:
        - markets.nordics
        - attribute: device
          operator: equals
          value: desktop
      percentage: 100
      variables:
        style: mixed

    - key: everyone
      conditions: "*"
      percentage: 0

  production:
    - key: plain
      conditions: country == 'nl' and device == 'mobile' # featurevisor-ignore-line
      percentage: 100
      variables:
        style: plain

    - key: double-quoted
      conditions: "country == 'de' and device == 'mobile'" # featurevisor-ignore-line
      percentage: 100
      variables:
        style: double-quoted

    - key: literal-block
      conditions: |
        # A literal block keeps line breaks, so comment lines work
        country == 'at'
        and device == 'mobile'
      percentage: 100
      variables:
        style: literal-block

    - key: folded-block
      conditions: >- # featurevisor-ignore-line
        country == 'ch'
        and device == 'mobile'
      percentage: 100
      variables:
        style: folded-block

    - key: list
      conditions:
        - country == 'lu'
        - device == 'mobile'
      percentage: 100
      variables:
        style: list

    - key: tree-group
      conditions:
        or:
          - |
            country == 'dk'
            and device == 'mobile'
          - |
            country == 'se'
            and device == 'tablet'
      percentage: 100
      variables:
        style: tree-group

    - key: mixed
      conditions:
        - markets.nordics
        - attribute: device
          operator: equals
          value: desktop
      percentage: 100
      variables:
        style: mixed

    - key: everyone
      conditions: "*"
      percentage: 0
