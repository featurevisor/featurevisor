description: Release channels picked by operating system and browser versions

tags:
  - all
  - fel

bucketBy: userId

variablesSchema:
  channel:
    type: string
    defaultValue: stable

rules:
  staging:
    - key: broken-builds
      conditions: devices.brokenBuilds
      percentage: 0

    - key: canary
      conditions: |
        devices.prereleaseOs
        or cohorts includes 'canary'
      percentage: 100
      variables:
        channel: canary

    - key: fast
      conditions: |
        devices.modernIos
        or browser.version >= semver('121.0.0')
      percentage: 100
      variables:
        channel: fast

    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: broken-builds
      conditions: devices.brokenBuilds
      percentage: 0

    - key: canary
      conditions: |
        devices.prereleaseOs
        or cohorts includes 'canary'
      percentage: 100
      variables:
        channel: canary

    - key: fast
      conditions: |
        devices.modernIos
        or browser.version >= semver('121.0.0')
      percentage: 100
      variables:
        channel: fast

    - key: everyone
      conditions: "*"
      percentage: 100
