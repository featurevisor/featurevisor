description: Fraud checks mixing numbers, null, not groups, and tree leaves beside FEL

tags: [all, checkout, fel]

bucketBy: userId

conditions: cartTotal > 0

variablesSchema:
  action:
    type: string
    defaultValue: allow

rules:
  staging: &rules
    - key: manual-review
      conditions:
        or:
          - riskScore >= 0.75

          # An explicit null means scoring failed, which differs from a missing score
          - riskScore isNull and cartTotal >= 500

          # A tree leaf sits beside FEL strings in the same group
          - attribute: couponCode
            operator: matches
            value: "^test-"
            regexFlags: i
      percentage: 100
      variables:
        action: review

    - key: step-up
      conditions:
        - riskScore >= 0.4
        - not:
            - audiences.verifiedEnterprise
      percentage: 100
      variables:
        action: challenge

    - key: everyone
      conditions: "*"
      percentage: 100

  production: *rules
