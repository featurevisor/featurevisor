description: for testing expose property with tags
tags:
  - all
  - checkout

bucketBy: userId

force:
  staging:
    - conditions: qa
      enabled: true

    - conditions: userId == 'user-3'
      enabled: true

rules:
  staging:
    - key: "1"
      conditions: "*"
      percentage: 0

  production:
    - key: "1"
      conditions: "*"
      percentage: 0

expose:
  staging:
    # this means, this feature:
    #   - will exist in datafiles/staging/featurevisor-checkout.json only
    #   - not exist in datafiles/staging/featurevisor-all.json
    - checkout

# See README for additional test scripts for verifying the datafile generation
