description: Feature variable whose value depends on global configuration
tags: [all]
bucketBy: userId
variablesSchema:
  config.policy:
    type: object
    properties:
      retries: { type: integer }
    defaultValue: { retries: 3 }
    disabledValue: { retries: 0 }
rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100
  production:
    - key: everyone
      conditions: "*"
      percentage: 100
      variableOverrides:
        config.policy:
          - key: priority
            conditions: variable('runtimePolicy').routing.priority == true
            value: { retries: 5 }
