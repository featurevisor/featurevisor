description: One page checkout, with FEL in every place a feature holds conditions

tags:
  - all
  - checkout
  - fel

bucketBy: userId

# Root conditions apply after force entries and before every rule
conditions: |
  # Signed in shoppers in a known country
  loggedIn == true
  and country exists

  # Never alongside the legacy checkout
  and feature('legacyCheckout') == false

variablesSchema:
  layout:
    type: string
    defaultValue: classic

  paymentMethods:
    type: array
    items:
      type: string
    defaultValue:
      - card

  limits:
    type: object
    properties:
      maxItems:
        type: integer
      maxTotal:
        type: number
    defaultValue:
      maxItems: 10
      maxTotal: 1000

  trustBadge:
    type: boolean
    defaultValue: false

variations:
  - value: control
    weight: 50

  - value: express
    weight: 50
    variables:
      layout: express
    variableOverrides:
      paymentMethods:
        - key: benelux
          conditions: markets.benelux
          value:
            - ideal
            - card

        - key: dach-small-carts
          conditions: markets.dach and cartTotal < 1000
          value:
            - sofort
            - card

force:
  staging:
    # QA accounts can try express anywhere, even where the legacy checkout is on
    - conditions: userId startsWith 'qa-' and couponCode == 'FORCE-EXPRESS'
      enabled: true
      variation: express

  production:
    - conditions: userId startsWith 'qa-' and couponCode == 'FORCE-EXPRESS'
      enabled: true
      variation: express

rules:
  staging:
    - key: staff
      conditions: audiences.staff
      percentage: 100
      variation: express

    - key: priority
      conditions: audiences.priorityCustomers
      percentage: 100
      variableOverrides:
        limits:
          - key: large-orders
            conditions: audiences.highValueCart or organization.employees > 999
            value:
              maxItems: 50
              maxTotal: 25000

        trustBadge:
          - key: low-risk
            conditions: audiences.lowRisk
            value: true

    - key: europe
      conditions: |
        markets.europe
        and not audiences.anonymous
      percentage: 50

    - key: everyone
      conditions: "*"
      percentage: 0

  production:
    - key: staff
      conditions: audiences.staff
      percentage: 100
      variation: express

    - key: priority
      conditions: audiences.priorityCustomers
      percentage: 100
      variableOverrides:
        limits:
          - key: large-orders
            conditions: audiences.highValueCart or organization.employees > 999
            value:
              maxItems: 50
              maxTotal: 25000

        trustBadge:
          - key: low-risk
            conditions: audiences.lowRisk
            value: true

    - key: europe
      conditions: |
        markets.europe
        and not audiences.anonymous
      percentage: 50

    - key: everyone
      conditions: "*"
      percentage: 0
