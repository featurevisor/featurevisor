segment: markets.benelux

assertions:
  - description: a Dutch shopper matches
    context:
      country: "nl"
    expectedToMatch: true

  - description: Luxembourg is in the list too
    context:
      country: "lu"
    expectedToMatch: true

  - description: Germany is not
    context:
      country: "de"
    expectedToMatch: false

  - description: comparison is case sensitive
    context:
      country: "NL"
    expectedToMatch: false

  - description: a missing country never matches in
    context: {}
    expectedToMatch: false
