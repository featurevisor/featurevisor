description: The old checkout, still on in North America while smartCheckout rolls out elsewhere

tags:
  - all
  - checkout
  - expressions

bucketBy: userId

rules:
  staging:
    - key: north-america
      conditions: markets.northAmerica
      percentage: 100

    - key: everyone-else
      conditions: "*"
      percentage: 0

  production:
    - key: north-america
      conditions: markets.northAmerica
      percentage: 100

    - key: everyone-else
      conditions: "*"
      percentage: 0
