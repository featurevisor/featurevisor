description: Demonstrates empty and notEmpty conditions with feature variables

tags:
  - all

bucketBy: userId

variablesSchema:
  status:
    type: string
    defaultValue: No emptiness rule matched

rules:
  staging:
    - key: empty-context
      conditions: emptyProfile
      percentage: 100
      variables:
        status: All values are empty

    - key: populated-context
      conditions: nonEmptyProfile
      percentage: 100
      variables:
        status: All values are populated

  production:
    - key: empty-context
      conditions: emptyProfile
      percentage: 100
      variables:
        status: All values are empty

    - key: populated-context
      conditions: nonEmptyProfile
      percentage: 100
      variables:
        status: All values are populated
