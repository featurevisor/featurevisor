description: Fraud checks with numbers, null, regular expressions and not groups

tags:
  - all
  - checkout
  - expressions

bucketBy: userId

conditions: cartTotal > 0

variablesSchema:
  action:
    type: string
    defaultValue: allow

rules:
  staging:
    - key: manual-review
      conditions: |
        riskScore >= 0.75

        # An explicit null means scoring failed, which differs from a missing score
        or (
          riskScore isNull
          and cartTotal >= 500
        )

        # Test coupons, in any letter case
        or couponCode matches /^test-/i
      percentage: 100
      variables:
        action: review

    - key: step-up
      conditions: |
        riskScore >= 0.4
        and not audiences.verifiedEnterprise
      percentage: 100
      variables:
        action: challenge

    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: manual-review
      conditions: |
        riskScore >= 0.75
        or (
          riskScore isNull
          and cartTotal >= 500
        )
        or couponCode matches /^test-/i
      percentage: 100
      variables:
        action: review

    - key: step-up
      conditions: |
        riskScore >= 0.4
        and not audiences.verifiedEnterprise
      percentage: 100
      variables:
        action: challenge

    - key: everyone
      conditions: "*"
      percentage: 100
