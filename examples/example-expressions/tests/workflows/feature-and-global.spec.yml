description: Feature variables can be checked alongside global settings

environment: staging

target: connection-tests

context:
  userId: customer-1

checks:
  - feature: checkout.page
    variable: paymentMethods
    operator: includes
    value: visa
  - variable: connectionSettings
    path: maximum
    operator: greaterThan
    compareTo:
      variable: connectionLimit

children:
  - stickyVariables:
      connectionLimit: 15
    checks:
      - variable: connectionLimit
        operator: lessThanOrEquals
        compareTo:
          variable: connectionSettings
          path: maximum
