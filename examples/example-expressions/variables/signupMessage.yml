description: Message selected through the signup feature rollout

tags:
  - all

type: string

defaultValue: Create your account

conditions: feature('allowSignup')

disabledValue: Sign up is unavailable

overrides:
  production:
    - key: treatment
      conditions: feature('allowSignup').variation == 'treatment'
      value: Sign up with your preferred provider

    - key: control
      conditions: feature('allowSignup').variation == 'control'
      value: Create your account
