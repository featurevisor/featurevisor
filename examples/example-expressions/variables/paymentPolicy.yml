description: Compose payment methods without duplicates and remove methods by value

tags:
  - all

type: array

items:
  type: string

defaultValue:
  - card
  - paypal
  - paypal

overrides:
  staging:
    - key: card-only
      conditions: "*"
      mutate:
        :removeValue: paypal
        :appendUnique: card

  production:
    - key: netherlands
      conditions: country == 'nl'
      continue: true
      mutate:
        :appendUnique: ideal
      overrides:
        - key: netherlands-confirm
          conditions: "*"
          mutate:
            :appendUnique: ideal

    - key: mobile
      conditions: device == 'mobile'
      mutate:
        :removeValue: paypal
