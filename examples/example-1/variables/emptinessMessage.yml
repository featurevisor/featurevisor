description: Demonstrates empty and notEmpty required variable expressions

tags:
  - all

type: string

defaultValue: No emptiness requirement matched

overrides:
  staging:
    - key: empty-source
      conditions:
        and:
          - variable: emptinessSource
            path: label
            operator: empty
          - variable: emptinessSource
            path: items
            operator: empty
          - variable: emptinessSource
            path: metadata
            operator: empty
      value: Source values are empty

    - key: populated-source
      conditions:
        and:
          - variable: emptinessSource
            path: label
            operator: notEmpty
          - variable: emptinessSource
            path: items
            operator: notEmpty
          - variable: emptinessSource
            path: metadata
            operator: notEmpty
      value: Source values are populated

  production:
    - key: empty-source
      conditions:
        and:
          - variable: emptinessSource
            path: label
            operator: empty
          - variable: emptinessSource
            path: items
            operator: empty
          - variable: emptinessSource
            path: metadata
            operator: empty
      value: Source values are empty

    - key: populated-source
      conditions:
        and:
          - variable: emptinessSource
            path: label
            operator: notEmpty
          - variable: emptinessSource
            path: items
            operator: notEmpty
          - variable: emptinessSource
            path: metadata
            operator: notEmpty
      value: Source values are populated
