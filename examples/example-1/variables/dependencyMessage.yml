description: Demonstrate feature conditions in global variable overrides

tags:
  - all

type: string

defaultValue: No condition based override matched

overrides:
  production:
    # Attribute and feature leaves use AND semantics
    - key: attribute-and-feature-conditions
      conditions:
        - attribute: country
          operator: equals
          value: nl
        - feature: showHeader
      value: Attribute and feature conditions matched

    # Segment and feature leaves also use AND semantics
    - key: segment-and-feature-conditions
      conditions:
        - countries.germany
        - feature: pricing
          enabled: true
          variation: treatment
      value: Segment and feature conditions matched

    # A feature leaf can be the only condition
    - key: feature-condition-only
      conditions:
        - feature: pricing
          enabled: false
          variation: control
      value: Feature condition matched
