description: Nested overrides combine ancestor conditions with dependency leaves

tags:
  - all

type: string

defaultValue: Standard

conditions: conditionAudience

disabledValue: Unavailable

overrides:
  production:
    - key: member
      conditions:
        attribute: loggedIn
        operator: equals
        value: true
      value: Member
      overrides:
        - key: treatment
          conditions:
            - feature: conditionSource
              variation: treatment
            - variable: conditionPolicy
              path:
                - enabled
              operator: equals
              value: true
          value: Treatment member

    - key: visitor
      conditions: "*"
      value: Visitor
