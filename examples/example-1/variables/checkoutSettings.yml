description: Shared settings used by checkout clients
tags:
  - checkout
type: object
properties:
  currency:
    type: string
  paymentMethods:
    type: array
    items:
      type: string
required:
  - currency
  - paymentMethods
defaultValue:
  currency: EUR
  paymentMethods:
    - visa
    - mastercard
overrides:
  staging:
    - key: staging-paypal
      segments: "*"
      mutate:
        paymentMethods:
          - visa
          - mastercard
          - paypal
  production:
    - key: netherlands
      segments: countries.netherlands
      mutate:
        paymentMethods:
          - ideal
          - paypal
    - key: default
      segments: "*"
      value:
        currency: EUR
        paymentMethods:
          - visa
          - mastercard
