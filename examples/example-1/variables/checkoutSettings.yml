description: Shared settings used by checkout clients

tags:
  - checkout

type: object

properties:
  currency:
    type: string
  paymentMethods:
    type: array
    items:
      type: string

required:
  - currency
  - paymentMethods

defaultValue:
  currency: EUR
  paymentMethods:
    - visa
    - mastercard

overrides:
  staging:
    - key: staging-paypal
      conditions: "*"
      mutate:
        paymentMethods:
          - visa
          - mastercard
          - paypal
  production:
    - key: netherlands
      conditions: countries.netherlands
      mutate:
        paymentMethods:
          - ideal
          - paypal
    - key: default
      conditions: "*"
      value:
        currency: EUR
        paymentMethods:
          - visa
          - mastercard
