description: Portable global mutation coverage for precomputed and runtime programs

tags:
  - all

type: object

properties:
  label:
    type: string
  clearedText:
    type: string
  emptyString:
    type: string
  emptyArray:
    type: array
    items:
      type: string
  emptyObject:
    type: object
    additionalProperties:
      type: boolean
  obsolete:
    type: string
  tags:
    type: array
    items:
      type: string
  flags:
    type: array
    items:
      type: boolean
  rows:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
        rank:
          type: integer
        active:
          type: boolean
        marker:
          type: string
        label:
          type: string
        numericSelector:
          type: boolean
        booleanSelector:
          type: boolean
        textNullSelector:
          type: boolean
        emptySelector:
          type: boolean
      required:
        - id
        - label
  scratch:
    type: array
    items:
      type: string
  sequence:
    type: array
    items:
      type: string

required:
  - label

defaultValue:
  label: default
  clearedText: occupied
  emptyString: occupied
  emptyArray:
    - occupied
  emptyObject:
    occupied: true
  obsolete: remove me
  tags:
    - duplicate
    - duplicate
    - keep
  flags:
    - true
    - false
  rows:
    - id: first
      rank: 1
      active: true
      marker: "null"
      label: First
    - id: second
      rank: 2
      active: false
      marker: present
      label: Second
    - id: ""
      rank: 3
      active: false
      marker: empty
      label: Empty identifier
  scratch:
    - zero
    - one
    - two
  sequence: []

overrides:
  staging:
    - key: netherlands
      conditions:
        attribute: country
        operator: equals
        value: nl
      mutate:
        label: Parent
        clearedText: ""
        emptyString: ""
        emptyArray: []
        emptyObject: {}
        obsolete:remove: null
        tags:removeValue: duplicate
        tags:appendUnique: new
        tags:prepend: first
        tags:append: last
        flags:appendUnique: true
        rows[0]:before:
          id: before
          label: Before
        rows[id=first]:after:
          id: after
          label: After
        rows[id=first].label: Selected by string
        rows[rank=2].numericSelector: true
        rows[active=true].booleanSelector: true
        rows[marker=null].textNullSelector: true
        rows[id=''].emptySelector: true
        rows[id=missing].label: Ignored
        scratch[1]: One
        scratch[0]:remove: null
        rows[id=after]:remove: null
      overrides:
        - key: reset
          conditions:
            attribute: loggedIn
            operator: equals
            value: true
          value:
            label: Reset
            clearedText: ""
            emptyString: ""
            emptyArray: []
            emptyObject: {}
            tags: []
            flags: []
            rows: []
            scratch: []
            sequence: []

        - key: amsterdam-treatment
          conditions:
            - attribute: city
              operator: equals
              value: amsterdam
            - feature: allowSignup
              variation: treatment
            - variable: runtimePolicy
              path: routing.enabled
              operator: equals
              value: true
          mutate:
            label: Treatment child
            rows[id=first].label: Treatment row

        - key: amsterdam-control
          conditions:
            - attribute: city
              operator: equals
              value: amsterdam
            - feature: allowSignup
              variation: control
          value:
            label: Control child
            clearedText: ""
            emptyString: ""
            emptyArray: []
            emptyObject: {}
            tags:
              - control
            flags: []
            rows: []
            scratch: []
            sequence: []

    - key: country-fallback
      conditions: "*"
      value:
        label: Country fallback
        clearedText: ""
        emptyString: ""
        emptyArray: []
        emptyObject: {}
        tags: []
        flags: []
        rows: []
        scratch: []
        sequence: []

  production:
    - key: bootstrap
      conditions: "*"
      continue: true
      value:
        label: Production
        clearedText: ""
        emptyString: ""
        emptyArray: []
        emptyObject: {}
        tags: []
        flags: []
        rows: []
        scratch: []
        sequence:
          - base

    - key: treatment
      conditions:
        feature: allowSignup
        variation: treatment
      continue: true
      mutate:
        sequence:append: treatment

    - key: priority
      conditions:
        variable: runtimePolicy
        path: routing.priority
        operator: equals
        value: true
      continue: true
      mutate:
        sequence:append: priority

    - key: netherlands
      conditions:
        attribute: country
        operator: equals
        value: nl
      mutate:
        sequence:append: netherlands
