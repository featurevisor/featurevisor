description: Array prerequisites evaluate both global and feature variables

tags:
  - all

type: string

defaultValue: No evaluated policy

overrides:
  staging: &overrides
    - key: writer-notice
      conditions:
        and:
          - variable: permissionPolicy
            path: actions
            operator: includesAny
            value:
              - write
              - admin
          - feature: permissionMembership
            variable: actions
            operator: includesAny
            value:
              - write
              - admin
      value: Write access
    - key: reader-notice
      conditions:
        and:
          - variable: permissionPolicy
            path: actions
            operator: notIncludesAny
            value:
              - write
              - admin
          - feature: permissionMembership
            variable: actions
            operator: notIncludesAny
            value:
              - write
              - admin
      value: Read only access
  production: *overrides
