description: Support email address shown to users

tags:
  - all

metadata:
  owner: platform-team

  deadlines:
    review:
      by: "2027-01-15T09:00:00+01:00"
      description: Confirm the support inbox with the support team

type: string

defaultValue: support@example.com

overrides:
  staging:
    - key: staging
      conditions: "*"
      value: support-staging@example.com

  production:
    - key: netherlands
      conditions:
        attribute: country
        operator: equals
        value: nl
      value: support-nl@example.com

    - key: default
      conditions: "*"
      value: support@example.com
