description: Segment combining all condition leaf kinds

conditions:
  - countries.netherlands
  - attribute: device
    operator: equals
    value: mobile
  - feature: conditionSource
    variation: treatment
  - variable: conditionPolicy
    path: enabled
    operator: equals
    value: true
  - feature: conditionSource
    variable: policy
    path:
      - enabled
    operator: equals
    value: true
