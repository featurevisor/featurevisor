description: Root gate, force bypass and mixed rule conditions

tags:
  - all

bucketBy: userId

conditions: conditionAudience

force:
  staging:
    - conditions:
        attribute: userId
        operator: equals
        value: conditions-qa
      enabled: true

  production:
    - conditions:
        attribute: userId
        operator: equals
        value: conditions-qa
      enabled: true

rules:
  staging:
    - key: member
      conditions:
        - countries.netherlands
        - attribute: loggedIn
          operator: equals
          value: true
        - feature: conditionSource
          variation: treatment
        - variable: conditionPolicy
          path:
            - enabled
          operator: equals
          value: true
      percentage: 100

    - key: visitor
      conditions: "*"
      percentage: 100

  production:
    - key: member
      conditions:
        - countries.netherlands
        - attribute: loggedIn
          operator: equals
          value: true
        - feature: conditionSource
          variation: treatment
        - variable: conditionPolicy
          path:
            - enabled
          operator: equals
          value: true
      percentage: 100

    - key: visitor
      conditions: "*"
      percentage: 100
