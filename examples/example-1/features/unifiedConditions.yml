description: Root gate, force bypass and mixed rule conditions

tags:
  - all

bucketBy: userId

conditions: conditionAudience

force:
  staging: &force
    - conditions:
        attribute: userId
        operator: equals
        value: conditions-qa
      enabled: true
  production: *force

rules:
  staging: &rules
    - key: member
      conditions:
        - countries.netherlands
        - attribute: loggedIn
          operator: equals
          value: true
        - feature: conditionSource
          variation: treatment
        - variable: conditionPolicy
          path:
            - enabled
          operator: equals
          value: true
      percentage: 100

    - key: visitor
      conditions: "*"
      percentage: 100

  production: *rules
