description: Feature exercising default flat object and array attribute behavior

tags:
  - all

bucketBy: userId

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100

  production:
    - key: dark-mode-sports
      conditions:
        and:
          - prefersDarkMode
          - interestedInSports
      percentage: 100

    - key: everyone
      conditions: "*"
      percentage: 0
