description: Checks `not` operator in segments

tags:
  - all

bucketBy: userId

rules:
  staging:
    - key: "1"
      conditions:
        - not:
            - version_5_5
      percentage: 100

    - key: "2"
      conditions: "*"
      percentage: 0

  production:
    - key: "1"
      conditions: "*"
      percentage: 80
