description: Feature gated by both global and feature variable values
tags: [all]
bucketBy: userId
conditions:
  - variable: runtimePolicy
    path: routing.enabled
    operator: equals
    value: true
  - feature: variablePolicySource
    variable: config.policy
    path: [retries]
    operator: greaterThanOrEquals
    value: 3
rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100
  production:
    - key: everyone
      conditions: "*"
      percentage: 100
