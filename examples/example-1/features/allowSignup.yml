description: Allow signup
tags:
  - all

bucketBy: deviceId

variablesSchema:
  allowRegularSignUp:
    type: boolean
    defaultValue: true
  allowGoogleSignUp:
    type: boolean
    defaultValue: false
  allowGitHubSignUp:
    type: boolean
    defaultValue: false

variations:
  - value: control
    weight: 50
  - value: treatment
    weight: 50
    variables:
      allowGoogleSignUp: true
      allowGitHubSignUp: true

rules:
  staging:
    - key: "1"
      conditions: "*"
      percentage: 100
  production:
    - key: nl
      conditions:
        - countries.netherlands
      percentage: 100
      variation: treatment
    - key: ch
      conditions:
        - countries.switzerland
      percentage: 100
      variationWeights:
        control: 10
        treatment: 90
    - key: everyone
      conditions: everyone
      percentage: 100
