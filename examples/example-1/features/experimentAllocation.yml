description: Shared allocation for bar and qux with an explicit holdout
tags:
  - all

bucketBy: userId

variations:
  - value: bar
    weight: 40
  - value: qux
    weight: 40
  - value: holdout
    weight: 20

rules:
  staging:
    - key: everyone
      conditions: "*"
      percentage: 100
  production:
    - key: everyone
      conditions: "*"
      percentage: 100
