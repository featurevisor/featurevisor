description: Rule and variation mutations precompute ordered lists with repeated appends

tags:
  - all

bucketBy: userId

variablesSchema:
  ruleMethods:
    type: array
    items:
      type: string
    defaultValue:
      - card
  variationMethods:
    type: array
    items:
      type: string
    defaultValue:
      - card

variations:
  - value: control
    weight: 100
    variables:
      variationMethods:
        - card
    variableOverrides:
      variationMethods:
        - key: netherlands
          conditions:
            attribute: country
            operator: equals
            value: nl
          mutate:
            - :append: ideal
            - :append: paypal
        - key: unchanged
          conditions: "*"
          mutate: []

rules:
  staging:
    - key: all
      conditions: "*"
      percentage: 100
      variables:
        ruleMethods:
          - card
      variableOverrides:
        ruleMethods:
          - key: netherlands
            conditions:
              attribute: country
              operator: equals
              value: nl
            mutate:
              - :append: ideal
              - :append: paypal
          - key: unchanged
            conditions: "*"
            mutate: {}
  production:
    - key: all
      conditions: "*"
      percentage: 100
      variables:
        ruleMethods:
          - card
      variableOverrides:
        ruleMethods:
          - key: netherlands
            conditions:
              attribute: country
              operator: equals
              value: nl
            mutate:
              - :append: temporary
              - "[0]": payment
              - :removeValue: temporary
              - :append: ideal
              - :append: paypal
          - key: unchanged
            conditions: "*"
            mutate: []
