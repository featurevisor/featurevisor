feature: qux

assertions:
  - description: bar allocation and holdout disable qux
    matrix:
      environment:
        - staging
        - production
      bucket:
        - 20
        - 90
    environment: ${{ environment }}
    at: ${{ bucket }}
    expectedToBeEnabled: false
    expectedEvaluations:
      flag:
        reason: conditions_unmet

  - environment: production
    at: 33
    context:
      country: nl
    stickyFeatures:
      experimentAllocation:
        enabled: true
        variation: qux
    expectedToBeEnabled: true
    expectedVariation: control
    expectedVariables:
      fooConfig:
        foo: bar

