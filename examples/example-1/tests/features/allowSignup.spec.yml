feature: allowSignup

assertions:
  ##
  # DE
  #
  - description: DE at ${{ at }}% should have control variation
    matrix:
      at:
        - 40
    environment: production
    at: ${{ at }}
    context:
      country: de
    expectedToBeEnabled: true
    expectedVariation: control
    expectedVariables:
      allowRegularSignUp: true
      allowGoogleSignUp: false
      allowGitHubSignUp: false
    expectedEvaluations:
      flag:
        reason: rule
        ruleKey: everyone
        bucketValue: 40000
      variation:
        reason: allocated
        ruleKey: everyone
      variables:
        allowRegularSignUp:
          reason: variable_default
        allowGoogleSignUp:
          reason: variable_default
    children:
      - context:
          country: nl
        expectedToBeEnabled: true
        expectedVariation: treatment
        expectedVariables:
          allowGoogleSignUp: true
        expectedEvaluations:
          flag:
            reason: rule
            ruleKey: nl
            bucketValue: 40000
          variation:
            reason: rule
            ruleKey: nl
          variables:
            allowGoogleSignUp:
              reason: allocated
              ruleKey: nl

  - description: DE at ${{ at }}% should have treatment variation
    matrix:
      at:
        - 60
    environment: production
    at: ${{ at }}
    context:
      country: de
    expectedToBeEnabled: true
    expectedVariation: treatment
    expectedVariables:
      allowRegularSignUp: true
      allowGoogleSignUp: true
      allowGitHubSignUp: true

  ##
  # NL
  #
  - description: NL at ${{ at }}% should have treatment variation
    matrix:
      at:
        - 40
        - 60
    environment: production
    at: ${{ at }}
    context:
      country: nl
    expectedToBeEnabled: true
    expectedVariation: treatment
    expectedVariables:
      allowRegularSignUp: true
      allowGoogleSignUp: true
      allowGitHubSignUp: true

  ##
  # CH
  #
  - description: CH at ${{ at }}% should have control variation
    matrix:
      at:
        - 5
        - 8
    environment: production
    at: ${{ at }}
    context:
      country: ch
    expectedToBeEnabled: true
    expectedVariation: control
    expectedVariables:
      allowRegularSignUp: true
      allowGoogleSignUp: false
      allowGitHubSignUp: false

  - description: CH at ${{ at }}% should have treatment variation
    matrix:
      at:
        - 15
        - 20
        - 40
        - 50
        - 60
        - 80
        - 100
    environment: production
    at: ${{ at }}
    context:
      country: ch
    expectedToBeEnabled: true
    expectedVariation: treatment
    expectedVariables:
      allowRegularSignUp: true
      allowGoogleSignUp: true
      allowGitHubSignUp: true
