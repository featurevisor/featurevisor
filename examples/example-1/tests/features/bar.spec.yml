feature: bar
assertions:
  - description: qux allocation and holdout disable bar
    matrix:
      environment: [staging, production]
      bucket: [60, 90]
    environment: ${{ environment }}
    at: ${{ bucket }}
    expectedToBeEnabled: false
    expectedEvaluations:
      flag:
        reason: conditions_unmet

  - at: 30
    environment: staging
    stickyFeatures:
      experimentAllocation: { enabled: true, variation: bar }
    context:
      country: us
    expectedToBeEnabled: true
    expectedVariation: control
    expectedVariables:
      color: red
      hero:
        title: Hero Title
        subtitle: Hero Subtitle
        alignment: center

  - at: 40
    environment: staging
    stickyFeatures:
      experimentAllocation: { enabled: true, variation: bar }
    context:
      country: us
    expectedToBeEnabled: true
    expectedVariation: b
    expectedVariables:
      color: red
      hero:
        title: Hero Title for B
        subtitle: Hero Subtitle for B
        alignment: center for B

  - at: 40
    environment: staging
    stickyFeatures:
      experimentAllocation: { enabled: true, variation: bar }
    context:
      country: de
    expectedToBeEnabled: true
    expectedVariation: b
    expectedVariables:
      color: red
      hero:
        title: Hero Title for B in DE or CH
        subtitle: Hero Subtitle for B in DE of CH
        alignment: center for B in DE or CH
