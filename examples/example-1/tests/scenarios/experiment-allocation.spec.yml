description: Shared allocation is exclusive at ${{ bucket }} percent in ${{ environment }}
matrix:
  environment: [staging, production]
  bucket: [0, 20, 40, 40.001, 60, 80, 80.001, 90, 100]
environment: ${{ environment }}
at: ${{ bucket }}
context:
  userId: allocation-example
  country: nl
checks:
  - key: allocation-matches-features
    or:
      - and:
          - feature: experimentAllocation
            variation: bar
          - feature: bar
            enabled: true
          - feature: qux
            enabled: false
      - and:
          - feature: experimentAllocation
            variation: qux
          - feature: bar
            enabled: false
          - feature: qux
            enabled: true
      - and:
          - feature: experimentAllocation
            variation: holdout
          - feature: bar
            enabled: false
          - feature: qux
            enabled: false
  - key: never-both-enabled
    not:
      - and:
          - feature: bar
            enabled: true
          - feature: qux
            enabled: true
