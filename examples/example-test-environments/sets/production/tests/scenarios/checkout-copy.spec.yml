description: Checkout copy is present for ${{ team }}

matrix:
  team:
    - engineering
    - marketing

target: all

context:
  team: ${{ team }}
  userId: customer-1

checks:
  - feature: checkoutFlow
    variation: null
  - variable: checkoutMessage
    operator: notNull
  - variable: checkoutMessage
    operator: contains
    value: checkout

children:
  - stickyFeatures:
      checkoutFlow:
        enabled: true
    stickyVariables:
      checkoutMessage: Contact support
    checks:
      - feature: checkoutFlow
        enabled: true
        variation: null
      - variable: checkoutMessage
        operator: startsWith
        value: Contact
