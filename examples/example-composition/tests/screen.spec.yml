variable: screen

assertions:
  - description: Evaluates disabled sources independently
    context:
      userId: example-user
    expectedValue:
      flag: false
      variation: unavailable
      label: Not available
      flags:
        checkout: true
        delivery: false
      config:
        policy:
          limit: 50
        raw:
          source: example
    checks:
      - path: [flag]
        operator: equals
        value: false
      - path: [variation]
        operator: equals
        value: unavailable
      - path: [config, policy, limit]
        operator: equals
        value: 50
    children:
      - context:
          country: nl
        checks:
          - path: [config, policy, limit]
            operator: equals
            value: 75
          - path: [config, raw, source]
            operator: equals
            value: example
  - description: Whole variable sticky state
    stickyVariables:
      screen:
        stickyFeatures: true
    expectedValue:
      stickyFeatures: true
  - description: Source sticky state and target closure
    target: web
    stickyFeatures:
      checkout:
        enabled: false
    stickyVariables:
      policy:
        limit: 90
    checks:
      - path: [flags, checkout]
        operator: equals
        value: false
      - path: [config, policy, limit]
        operator: equals
        value: 90
    expectedEvaluation:
      reason: variable_composed
