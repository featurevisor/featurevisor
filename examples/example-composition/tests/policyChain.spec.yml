variable: policyChain

assertions:
  - description: Reads the source default without wrapping it
    target: aliases
    context:
      country: de
    expectedValue:
      limit: 50
    expectedEvaluation:
      reason: variable_composed

  - description: Applies source overrides before alias overrides
    target: aliases
    context:
      country: nl
    expectedValue:
      limit: 90
    checks:
      - variable: policy
        path:
          - limit
        operator: equals
        value: 75

  - description: Uses nested alias overrides without changing the source
    target: aliases
    context:
      country: nl
      city: Amsterdam
    expectedValue:
      limit: 100
    checks:
      - variable: policy
        path:
          - limit
        operator: equals
        value: 75

  - description: A null source stays null when a mutation cannot reach its path
    target: aliases
    context:
      country: nl
    stickyVariables:
      policy: null
    expectedValue: null

  - description: Whole alias sticky values bypass the source
    target: aliases
    context:
      country: nl
    stickyVariables:
      policyChain:
        limit: 7
    expectedValue:
      limit: 7
    expectedEvaluation:
      reason: sticky
